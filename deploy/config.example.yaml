# Clawbench Fleet 平台配置示例
# 安装脚本会把它写到 /etc/clawbench-fleet/config.yaml

# 管理界面的监听地址。建议用防火墙把 30000 限制到管理员网段。
listen: "0.0.0.0:30000"

# 平台自己的数据（数据库、备份、回收站、日志）
data_dir: "/var/lib/clawbench-fleet"

clawbench:
  # Clawbench 版本目录和 current 软链的位置
  install_dir: "/opt/clawbench-fleet"
  # 租户端口范围；每个租户预留 3 个（主端口 + 2 个预留）
  port_start: 21000
  port_end: 29999
  ports_per_tenant: 3
  # Linux 用户 UID 分配范围
  uid_start: 3000
  uid_end: 9999
  # 新建租户的默认资源上限（systemd CPUQuota / MemoryMax / TasksMax）
  default_cpu_quota: "200%"
  default_memory_max: "4G"
  default_tasks_max: 512
  # 单个租户家目录超过这个值就在总览页提醒（0 = 关闭提醒）
  disk_warn_gb: 5
  # 新建租户的默认磁盘硬上限（GB，0 = 不限制）。超过上限的实例会被停掉并锁定 SSH。
  disk_quota_gb: 0
  # 是否允许员工在实例里开端口转发（默认关，防止绕过管理直接对外暴露端口）
  allow_port_forward: false
  # 员工地址里显示的主机名；留空自动探测本机内网 IP
  public_host: ""
  # 从 npm 安装新版本时用的包名（Clawbench 官方发布包）
  npm_package: "@xulongzhe/clawbench"
  # npm 源；留空用服务器默认源。内网可填私有镜像，例如
  # https://registry.npmmirror.com/
  npm_registry: ""

backup:
  enabled: true
  hour: 3
  retention_days: 7

trash:
  retention_days: 30

audit:
  retention_days: 180

tls:
  # 平台管理界面自己的 HTTPS 证书目录，留空表示平台走 HTTP。
  # 注意：这个和下面「下发给实例的证书」是两回事，互不影响。
  cert_dir: ""

# 下发给每个员工实例的 HTTPS 证书（统一自签）。
# 打开后平台自动生成一份自签证书，下发给所有实例共用；
# 员工第一次打开实例时浏览器会警告一次，点继续即可。
tenant_tls:
  enabled: true
  # 证书存放目录，留空使用 <data_dir>/certs
  cert_dir: ""

system:
  home_root: "/home"
  systemd_dir: "/etc/systemd/system"
  user_shell: "/usr/sbin/nologin"

ssh:
  # 新建租户默认是否开 SSH（每个租户还能在详情页单独关）
  enabled: true
  # 开 SSH 的租户使用的登录 shell
  shell: "/bin/bash"
  # 员工地址里展示的 SSH 端口；留 0 表示问 sshd，问不到就用 22
  port: 0
