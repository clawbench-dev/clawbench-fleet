name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  golangci-lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m
          only-new-issues: true

  test:
    name: Test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Compile integration tests
        # The integration suites sit behind `//go:build integration`, so the
        # step below never compiles them. `go vet` type-checks test files too,
        # so this is a compile-only guard against refactors that leave an
        # integration file referencing a moved symbol.
        run: go vet -tags integration ./...

      - name: Go test
        # `-timeout` is per test binary; the 20m ceiling catches hangs while
        # leaving headroom for a slow runner.
        run: go test -timeout 20m ./...

      - name: Go build
        run: go build ./cmd/fleet

  integration:
    name: Test (Integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Go integration tests
        run: go test -tags integration -timeout 20m ./...

  coverage-go:
    name: Coverage Gate (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download main baseline
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v8
        with:
          workflow: ci.yml
          branch: main
          name: main-go-coverage
          path: .clawbench-ci/baseline/
        continue-on-error: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run coverage gate check
        run: |
          set +e
          ./scripts/check-go-coverage.sh
          exit_code=$?
          set -e
          if [ $exit_code -eq 2 ]; then
            echo "::warning::Tier 1 (Project) coverage gate failed — baseline drift, non-blocking"
            exit 0
          fi
          exit $exit_code

      - name: Upload coverage profile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: main-go-coverage
          path: coverage.out
          retention-days: 90

  npm:
    name: Package (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Launcher unit tests
        working-directory: npm
        run: npm test

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint (ESLint)
        working-directory: web
        run: npx eslint src/

      - name: Typecheck and build
        working-directory: web
        run: npm run build

      - name: Unit tests
        working-directory: web
        run: npm test

  coverage-frontend:
    name: Coverage Gate (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download main baseline
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v8
        with:
          workflow: ci.yml
          branch: main
          name: main-frontend-coverage
          path: .clawbench-ci/baseline/
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run coverage gate check
        run: ./scripts/check-frontend-coverage.sh

      - name: Upload coverage data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: main-frontend-coverage
          path: |
            web/coverage/coverage-summary.json
            web/coverage/coverage-final.json
          retention-days: 90
